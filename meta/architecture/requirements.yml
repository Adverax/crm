non_functional:
  - id: NFR-001
    category: security
    metric: password_hash_algorithm
    threshold: bcrypt cost=12
    condition: for all stored user passwords
    rationale: Password hashing strength is fixed in the auth module (ADR-0017).
    acceptance:
      - id: AC-101
        test: TestHashPassword
        given: a plaintext password
        when: it is hashed and verified
        then: the stored value is a bcrypt hash that verifies via CheckPassword
        kind: conformance
    _meta: { source: reverse-engineered, confidence: high, as_built: true, evidence: ["internal/modules/auth/"] }
  - id: NFR-002
    category: security
    metric: login_rate_limit
    threshold: 5 attempts / 15 min per IP
    condition: on /auth/login and /auth/forgot-password
    rationale: In-memory sliding-window rate limiting (ADR-0017).
    acceptance:
      - id: AC-102
        given: 5 attempts from one IP within 15 minutes
        when: a 6th attempt is made
        then: the attempt is rejected by the rate limiter until the window expires
        test: TestRateLimiter_WindowExpiry
        kind: boundary
    _meta: { source: reverse-engineered, confidence: high, as_built: true, evidence: ["internal/modules/auth/"] }
  - id: NFR-003
    category: performance
    metric: effective_cache_recompute_scope
    threshold: incremental (only affected user/role/group)
    condition: on a permission/role/group change event
    rationale: Outbox-driven incremental recompute keeps access checks fast (ADR-0012).
    _meta: { source: reverse-engineered, confidence: medium, as_built: true, evidence: ["internal/platform/security/outbox_worker.go"], gaps: ["Latency target not specified in code; only scope is enforced."] }
  - id: NFR-004
    category: security
    metric: credential_encryption
    threshold: AES-256-GCM, unique nonce per record, HTTPS-only
    condition: for all stored Named Credentials and outbound integration calls
    rationale: Secret-at-rest protection and SSRF mitigation (ADR-0028).
    acceptance:
      - id: AC-104
        given: the same plaintext secret encrypted twice
        when: it is stored
        then: ciphertexts differ (unique nonce) and each decrypts to the original
        test: TestEncryptUniqueness
        kind: conformance
    _meta: { source: reverse-engineered, confidence: high, as_built: true, evidence: ["internal/platform/credential/"] }

