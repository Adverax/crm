version: 1
stage: pre-launch
language: en

paths:
  architecture: meta/architecture/
  existing_adrs: docs/adr/
  kanban: meta/kanban/
  backlog: meta/kanban/backlog.md
  backlog_scored: meta/kanban/backlog-scored.yml
  roadmap: docs/roadmap.md
  review_reports: meta/review/
  fix_suppress: .claude/fix-suppress.yaml
  retro: meta/kanban/retro.md

methodology:
  default: wsjf
  per_category:
    feature: rice
    enabler: wsjf
    tech-debt: wsjf
    compliance: wsjf
    ops: fifo

extra_categories: []

ci:
  enabled: true
  gates:
    validator_errors: error
    blocking_decisions: error
    stale_artifacts: warn
    reverse_pending: off

models:
  profile: balanced

git_tracking:
  preset: solo
